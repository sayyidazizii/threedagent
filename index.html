<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Office - L-Shape Layout (Open Center)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at center, #1e2538 0%, #0d111a 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      height: 100vh;
      user-select: none;
    }
    #webgl-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* BUBBLE CHAT DINAMIS */
    #speech-bubble {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 20;
      pointer-events: none;
      transform: translate(-50%, -100%);
      background: #ffffff;
      color: #0f172a;
      padding: 8px 14px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.3px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35), 0 0 0 2px rgba(56, 189, 248, 0.85);
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.2s ease;
    }
    #speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 6px 6px 0 6px;
      border-style: solid;
      border-color: #ffffff transparent transparent transparent;
    }
    .typing-dots {
      display: inline-block;
      animation: blink 1.2s infinite steps(1);
    }
    @keyframes blink {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }

    /* FLOATING ACTION DOCK (3 ICON BUTTONS) */
    .icon-dock {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      display: flex;
      gap: 14px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      padding: 10px 18px;
      border-radius: 36px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
    }
    .icon-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.6);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: white;
      transition: all 0.15s ease;
      position: relative;
    }
    .btn-work {
      background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
      box-shadow: 0 5px 0 #0369a1, 0 8px 16px rgba(2, 132, 199, 0.4);
    }
    .btn-work:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 8px 0 #0369a1; }
    .btn-work:active { transform: translateY(3px) scale(0.98); box-shadow: 0 2px 0 #0369a1; }

    .btn-rest {
      background: linear-gradient(180deg, #fbbf24 0%, #d97706 100%);
      box-shadow: 0 5px 0 #b45309, 0 8px 16px rgba(217, 119, 6, 0.4);
    }
    .btn-rest:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 8px 0 #b45309; }
    .btn-rest:active { transform: translateY(3px) scale(0.98); box-shadow: 0 2px 0 #b45309; }

    .btn-drink {
      background: linear-gradient(180deg, #34d399 0%, #059669 100%);
      box-shadow: 0 5px 0 #047857, 0 8px 16px rgba(5, 150, 105, 0.4);
    }
    .btn-drink:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 8px 0 #047857; }
    .btn-drink:active { transform: translateY(3px) scale(0.98); box-shadow: 0 2px 0 #047857; }

    .icon-btn::before {
      content: attr(data-tooltip);
      position: absolute;
      top: -36px;
      background: #0f172a;
      color: #f8fafc;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 8px;
      opacity: 0;
      pointer-events: none;
      transition: 0.2s ease;
      white-space: nowrap;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .icon-btn:hover::before { opacity: 1; top: -42px; }

    /* PANEL KONTROL REMOTE LOCAL AGENT */
    #control-panel {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 50;
      width: 300px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 14px;
      padding: 14px 16px;
      color: #f8fafc;
      font-size: 12px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .field-lbl {
      display: block;
      margin-bottom: 4px;
      color: #94a3b8;
      font-weight: 600;
      font-size: 11px;
    }
    .panel-input {
      width: 100%;
      background: #1e293b;
      border: 1px solid #475569;
      color: white;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
      margin-bottom: 8px;
      outline: none;
    }
    .panel-input:focus {
      border-color: #38bdf8;
    }
    .btn-act {
      background: #0284c7;
      border: none;
      color: white;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }
    .btn-act:hover { background: #0369a1; }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="webgl-container"></div>

  <!-- Bubble Chat Mengambang -->
  <div id="speech-bubble">
    <span id="bubble-emoji">💻</span>
    <span id="bubble-text">Sedang coding task...</span>
  </div>

  <!-- PANEL KONTROL REMOTE LOCAL AGENT -->
  <div id="control-panel">
    <div class="panel-header">
      <span style="font-weight: bold; font-size: 13px;">🕹️ Local Agent Hub</span>
      <span id="status-badge" style="background:#ef4444; padding:2px 8px; border-radius:10px; font-size:10px; font-weight:bold;">Offline</span>
    </div>

    <label class="field-lbl">Bridge WebSocket URL:</label>
    <div style="display:flex; gap:6px; margin-bottom:8px;">
      <input id="cfg-url" class="panel-input" style="margin-bottom:0;" value="ws://localhost:8080" placeholder="ws:// atau wss://...">
      <button id="btn-link" class="btn-act">Link</button>
    </div>

    <label class="field-lbl">Engine CLI Agent:</label>
    <select id="cfg-cli" class="panel-input">
      <option value="opencode">OpenCode</option>
      <option value="antigravity">Antigravity CLI</option>
      <option value="kiro">Kiro</option>
    </select>

    <label class="field-lbl">Path Folder Project Local:</label>
    <input id="cfg-path" class="panel-input" placeholder="Contoh: D:/projects/web-ku">

    <label class="field-lbl">Instruksi Prompt:</label>
    <textarea id="cfg-prompt" class="panel-input" rows="2" style="resize:none;" placeholder="Tulis tugas untuk agent..."></textarea>

    <button id="btn-run-task" class="btn-act" style="width:100%; background:#10b981; padding:8px; font-size:12px;">🚀 Jalankan Task</button>
  </div>

  <!-- 3 Tombol Icon Bawah (Dock) -->
  <div class="icon-dock">
    <button id="btn-work" class="icon-btn btn-work" data-tooltip="Kerja di Meja">💻</button>
    <button id="btn-rest" class="icon-btn btn-rest" data-tooltip="Istirahat ke Sofa">☕</button>
    <button id="btn-drink" class="icon-btn btn-drink" data-tooltip="Ambil Minum (Dispenser)">🚰</button>
  </div>

  <script>
    // 0. KOORDINAT STASIUN UTAMA
    const STATIONS = {
      desk: { pos: new THREE.Vector3(-2.0, 0.15, -2.08), rotY: Math.PI },
      sofa: { pos: new THREE.Vector3(2.6, 0.08, 0.45), rotY: 0.1 },
      dispenser: { pos: new THREE.Vector3(2.7, 0.15, -1.0), rotY: -Math.PI / 2 }
    };

    let agentState = 'WORKING'; // 'WORKING' | 'RESTING' | 'DRINKING' | 'WALKING'
    let targetStation = 'desk';

    const bubbleEl = document.getElementById('speech-bubble');
    const bubbleEmoji = document.getElementById('bubble-emoji');
    const bubbleText = document.getElementById('bubble-text');

    function updateBubble() {
      if (agentState === 'WORKING') {
        bubbleEmoji.innerText = '💻';
        bubbleText.innerHTML = 'Sedang coding task<span class="typing-dots">...</span>';
      } else if (agentState === 'RESTING') {
        bubbleEmoji.innerText = '🛋️';
        bubbleText.innerText = 'Santai rehat dulu 💤';
      } else if (agentState === 'DRINKING') {
        bubbleEmoji.innerText = '🥤';
        bubbleText.innerText = 'Gluk gluk... Segar banget! ✨';
      } else if (agentState === 'WALKING') {
        if (targetStation === 'sofa') {
          bubbleEmoji.innerText = '☕';
          bubbleText.innerText = 'Capek, mau ngopi ke sofa...';
        } else if (targetStation === 'dispenser') {
          bubbleEmoji.innerText = '💧';
          bubbleText.innerText = 'Haus, jalan ambil minum...';
        } else {
          bubbleEmoji.innerText = '🏃‍♂️';
          bubbleText.innerText = 'Ada task baru! Otw meja...';
        }
      }
    }

    window.changeAgentState = function(target) {
      if (agentState === 'WALKING') return;

      if (target === 'working' && agentState !== 'WORKING') {
        targetStation = 'desk';
        agentState = 'WALKING';
        updateBubble();
      } else if (target === 'resting' && agentState !== 'RESTING') {
        targetStation = 'sofa';
        agentState = 'WALKING';
        updateBubble();
      } else if (target === 'drinking' && agentState !== 'DRINKING') {
        targetStation = 'dispenser';
        agentState = 'WALKING';
        updateBubble();
      }
    };

    // EVENT LISTENER 3 TOMBOL DOCK MANUAL
    document.getElementById('btn-work').addEventListener('click', () => changeAgentState('working'));
    document.getElementById('btn-rest').addEventListener('click', () => changeAgentState('resting'));
    document.getElementById('btn-drink').addEventListener('click', () => changeAgentState('drinking'));

    // 1. SETUP THREE.JS PROYEKSI AKSONOMETRIK
    const container = document.getElementById('webgl-container');
    const scene = new THREE.Scene();

    const aspect = window.innerWidth / window.innerHeight;
    const d = 7.0;

    const camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, -100, 1000);
    camera.position.set(19, 15, 16);
    camera.lookAt(0, 0.7, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableRotate = true;
    controls.enableZoom = true;
    controls.target.set(0, 0.7, 0);

    // 2. LIGHTING
    const hemiLight = new THREE.HemisphereLight(0xfff7ed, 0x334155, 1.4);
    scene.add(hemiLight);

    const sunLight = new THREE.DirectionalLight(0xffedd5, 2.0);
    sunLight.position.set(16, 22, 10);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.bias = -0.0005;
    scene.add(sunLight);

    const monLight1 = new THREE.PointLight(0x38bdf8, 1.6, 4);
    monLight1.position.set(-2.0, 1.4, -2.5);
    scene.add(monLight1);

    const monLightLeft = new THREE.PointLight(0xf472b6, 1.6, 4);
    monLightLeft.position.set(-3.4, 1.4, 0.0);
    scene.add(monLightLeft);

    // 3. DIORAMA RUANGAN KANTOR
    const roomGroup = new THREE.Group();
    scene.add(roomGroup);

    const floorGeo = new THREE.BoxGeometry(8.8, 0.3, 6.6);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.7 });
    const floorMesh = new THREE.Mesh(floorGeo, floorMat);
    floorMesh.position.set(0, -0.15, 0);
    floorMesh.receiveShadow = true;
    roomGroup.add(floorMesh);

    const carpetGrid = new THREE.GridHelper(5.6, 12, 0x334155, 0x243044);
    carpetGrid.position.set(0.2, 0.01, 0.1);
    roomGroup.add(carpetGrid);

    const wallMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.5 });
    const backWall = new THREE.Mesh(new THREE.BoxGeometry(8.8, 3.4, 0.2), wallMat);
    backWall.position.set(0, 1.55, -3.3);
    backWall.receiveShadow = true;
    roomGroup.add(backWall);

    const sideWall = new THREE.Mesh(new THREE.BoxGeometry(0.2, 3.4, 6.6), wallMat);
    sideWall.position.set(-4.4, 1.55, 0);
    sideWall.receiveShadow = true;
    roomGroup.add(sideWall);

    // Jendela Kota Luas di Dinding Belakang
    const windowFrame = new THREE.Mesh(new THREE.BoxGeometry(3.2, 1.8, 0.08), new THREE.MeshStandardMaterial({ color: 0x475569 }));
    windowFrame.position.set(1.0, 1.8, -3.18);
    const windowGlass = new THREE.Mesh(
      new THREE.BoxGeometry(3.0, 1.6, 0.02),
      new THREE.MeshStandardMaterial({ color: 0x93c5fd, transparent: true, opacity: 0.6 })
    );
    windowGlass.position.set(1.0, 1.8, -3.16);
    roomGroup.add(windowFrame, windowGlass);

    [0.3, 1.0, 1.6].forEach((bx, idx) => {
      const bh = [1.2, 1.5, 1.0][idx];
      const bldg = new THREE.Mesh(new THREE.BoxGeometry(0.65, bh, 0.01), new THREE.MeshBasicMaterial({ color: 0x475569 }));
      bldg.position.set(bx, 1.0 + bh/2, -3.15);
      roomGroup.add(bldg);
    });

    // Papan Poster di Tembok Belakang
    const poster1 = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.7, 0.02), new THREE.MeshStandardMaterial({ color: 0x0284c7 }));
    poster1.position.set(-2.0, 2.1, -3.18);
    const poster2 = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.6, 0.02), new THREE.MeshStandardMaterial({ color: 0x0f766e }));
    poster2.position.set(-0.4, 2.1, -3.18);
    roomGroup.add(poster1, poster2);

    // Papan Tulis Analisis di Tembok Kiri
    const sideBoard = new THREE.Mesh(new THREE.BoxGeometry(0.02, 1.2, 3.4), new THREE.MeshStandardMaterial({ color: 0xf8fafc }));
    sideBoard.position.set(-4.28, 2.0, 0.0);
    const sideChart = new THREE.Mesh(new THREE.BoxGeometry(0.01, 0.4, 2.2), new THREE.MeshBasicMaterial({ color: 0x3b82f6 }));
    sideChart.position.set(-4.26, 2.0, -0.2);
    roomGroup.add(sideBoard, sideChart);

    // 4. FURNITUR: KURSI ERGONOMIS & MEJA PC DUAL MONITOR
    const steelMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.3 });
    const chromeMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.8, roughness: 0.2 });
    const chairMeshMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.6 });
    const woodMat = new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.4 });
    const cpuCaseMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.2 });

    function createErgonomicChair() {
      const chairGroup = new THREE.Group();
      const starGroup = new THREE.Group();
      for (let i = 0; i < 5; i++) {
        const angle = (i * Math.PI * 2) / 5;
        const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.32), steelMat);
        leg.rotation.z = Math.PI / 2;
        leg.rotation.y = angle;
        leg.position.set(Math.cos(angle) * 0.16, 0.05, Math.sin(angle) * 0.16);
        const wheel = new THREE.Mesh(new THREE.SphereGeometry(0.035, 8, 8), steelMat);
        wheel.position.set(Math.cos(angle) * 0.3, 0.035, Math.sin(angle) * 0.3);
        starGroup.add(leg, wheel);
      }
      chairGroup.add(starGroup);

      const cylinderLift = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.38), chromeMat);
      cylinderLift.position.y = 0.24;
      chairGroup.add(cylinderLift);

      const seatCushion = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.09, 0.46), chairMeshMat);
      seatCushion.position.y = 0.44;
      chairGroup.add(seatCushion);

      const backRest = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.48, 0.07), chairMeshMat);
      backRest.position.set(0, 0.74, 0.22);
      backRest.rotation.x = 0.1;
      chairGroup.add(backRest);

      [-0.24, 0.24].forEach(x => {
        const armSupport = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.18), steelMat);
        armSupport.position.set(x, 0.52, 0.02);
        const armPad = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.03, 0.24), chairMeshMat);
        armPad.position.set(x, 0.61, 0.02);
        chairGroup.add(armSupport, armPad);
      });

      return chairGroup;
    }

    function createDualMonitorDesk(xPos, zPos, primaryColor, secondaryColor, rotY = 0) {
      const deskGroup = new THREE.Group();
      deskGroup.position.set(xPos, 0, zPos);
      deskGroup.rotation.y = rotY;

      const top = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.09, 0.95), woodMat);
      top.position.y = 0.88;
      top.castShadow = true;
      deskGroup.add(top);

      [-0.62, 0.62].forEach(x => {
        [-0.38, 0.38].forEach(z => {
          const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.88), steelMat);
          leg.position.set(x, 0.44, z);
          leg.castShadow = true;
          deskGroup.add(leg);
        });
      });

      // CPU Tower
      const cpuTower = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.44, 0.44), cpuCaseMat);
      cpuTower.position.set(0.46, 0.22, -0.05);
      cpuTower.castShadow = true;
      const powerLed = new THREE.Mesh(new THREE.SphereGeometry(0.018, 8, 8), new THREE.MeshBasicMaterial({ color: primaryColor }));
      powerLed.position.set(0.46, 0.38, 0.18);
      deskGroup.add(cpuTower, powerLed);

      // Keyboard & Mouse
      const keyboard = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.02, 0.15), steelMat);
      keyboard.position.set(-0.06, 0.94, 0.15);
      const mouse = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.02, 0.08), steelMat);
      mouse.position.set(0.24, 0.94, 0.15);
      deskGroup.add(keyboard, mouse);

      // Dual Monitors
      const mon1 = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.36, 0.03), steelMat);
      mon1.position.set(-0.22, 1.2, -0.14);
      mon1.rotation.y = 0.12;
      const screen1 = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.32, 0.01), new THREE.MeshBasicMaterial({ color: primaryColor }));
      screen1.position.set(-0.22, 1.2, -0.12);
      screen1.rotation.y = 0.12;
      const stand1 = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.028, 0.28), steelMat);
      stand1.position.set(-0.22, 1.02, -0.14);
      deskGroup.add(mon1, screen1, stand1);

      const mon2 = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.36, 0.03), steelMat);
      mon2.position.set(0.3, 1.2, -0.11);
      mon2.rotation.y = -0.26;
      const screen2 = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.32, 0.01), new THREE.MeshBasicMaterial({ color: secondaryColor }));
      screen2.position.set(0.3, 1.2, -0.09);
      screen2.rotation.y = -0.26;
      const stand2 = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.028, 0.28), steelMat);
      stand2.position.set(0.3, 1.02, -0.11);
      deskGroup.add(mon2, screen2, stand2);

      // Kursi
      const chair = createErgonomicChair();
      chair.position.set(-0.06, 0, 0.5);
      deskGroup.add(chair);

      roomGroup.add(deskGroup);
    }

    // BUAT TATA LETAK MEJA L-SHAPE (5 STASIUN KERJA)
    createDualMonitorDesk(-2.0, -2.6, 0x38bdf8, 0x818cf8, 0); // Meja 1: Agent Utama
    createDualMonitorDesk(-0.4, -2.6, 0x10b981, 0xf59e0b, 0); // Meja 2: Coworker 1
    createDualMonitorDesk(-3.7, -1.6, 0x22c55e, 0x06b6d4, Math.PI / 2); // Meja 3: Coworker 2
    createDualMonitorDesk(-3.7, -0.05, 0xeab308, 0xf97316, Math.PI / 2); // Meja 4: Coworker 3
    createDualMonitorDesk(-3.7, 1.5, 0xf472b6, 0xc084fc, Math.PI / 2);  // Meja 5: Coworker Wanita

    // 5. SOFA SANTAI & MEJA KOPI
    const loungeGroup = new THREE.Group();
    loungeGroup.position.set(2.6, 0, 0.5);
    const sofaMat = new THREE.MeshStandardMaterial({ color: 0xe67e22, roughness: 0.35 });
    const sofaBase = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.36, 0.8), sofaMat); sofaBase.position.y = 0.22;
    const sofaBack = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.6, 0.22), sofaMat); sofaBack.position.set(0, 0.55, -0.3);
    const armL = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.44, 0.8), sofaMat); armL.position.set(-0.7, 0.38, 0);
    const armR = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.44, 0.8), sofaMat); armR.position.set(0.7, 0.38, 0);
    loungeGroup.add(sofaBase, sofaBack, armL, armR);

    const coffeeTable = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.04, 24), new THREE.MeshStandardMaterial({ color: 0x0284c7, transparent: true, opacity: 0.7 }));
    coffeeTable.position.set(0, 0.32, 0.75);
    const tableLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.32), steelMat);
    tableLeg.position.set(0, 0.16, 0.75);
    loungeGroup.add(coffeeTable, tableLeg);
    roomGroup.add(loungeGroup);

    // 6. POHON MONSTERA & DISPENSER AIR GALON
    const plantGroup = new THREE.Group();
    plantGroup.position.set(3.4, 0, -2.2);
    const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.22, 0.54, 16), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 }));
    pot.position.y = 0.27; plantGroup.add(pot);

      const topSphere = new THREE.Mesh(new THREE.SphereGeometry(radius, 16, 16), material);
      topSphere.position.y = height / 2;
      const btmSphere = new THREE.Mesh(new THREE.SphereGeometry(radius, 16, 16), material);
      btmSphere.position.y = -height / 2;
      g.add(cyl, topSphere, btmSphere);
      return g;
    }
