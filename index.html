<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Office - Remote Agent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at center, #1e2538 0%, #0d111a 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden; height: 100vh; user-select: none;
    }
    #webgl-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
    #speech-bubble {
      position: absolute; top: 0; left: 0; z-index: 20; pointer-events: none;
      transform: translate(-50%, -100%); background: #ffffff; color: #0f172a;
      padding: 8px 14px; border-radius: 16px; font-size: 12px; font-weight: 700;
      box-shadow: 0 8px 20px rgba(0,0,0,0.35), 0 0 0 2px rgba(56, 189, 248, 0.85);
      white-space: nowrap; display: flex; align-items: center; gap: 6px;
    }
    #speech-bubble::after {
      content: ''; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%);
      border-width: 6px 6px 0 6px; border-style: solid; border-color: #ffffff transparent transparent transparent;
    }
    /* Control Panel */
    #control-panel {
      position: absolute; top: 16px; left: 16px; z-index: 50; width: 310px;
      background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.18); border-radius: 14px;
      padding: 16px; color: #f8fafc; font-size: 12px; box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    }
    .field-label { display: block; margin-bottom: 4px; color: #94a3b8; font-weight: 600; }
    .input-box {
      width: 100%; background: #1e293b; border: 1px solid #475569; color: white;
      padding: 7px 10px; border-radius: 6px; font-size: 11px; margin-bottom: 10px; outline: none;
    }
    .input-box:focus { border-color: #38bdf8; }
    .btn-act {
      background: #0284c7; border: none; color: white; padding: 7px 12px;
      border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s;
    }
    .btn-act:hover { background: #0369a1; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div id="webgl-container"></div>

  <div id="speech-bubble">
    <span id="bubble-emoji">💻</span>
    <span id="bubble-text">Menunggu instruksi...</span>
  </div>

  <!-- Panel Kontrol Remote -->
  <div id="control-panel">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <span style="font-weight: bold; font-size: 13px;">🕹️ Local Agent Hub</span>
      <span id="status-badge" style="background:#ef4444; padding:2px 8px; border-radius:10px; font-size:10px; font-weight:bold;">Offline</span>
    </div>

    <label class="field-label">Bridge WebSocket URL:</label>
    <div style="display:flex; gap:6px; margin-bottom:10px;">
      <input id="cfg-url" class="input-box" style="margin-bottom:0;" value="ws://localhost:8080" placeholder="ws:// atau wss://...">
      <button id="btn-connect" class="btn-act">Link</button>
    </div>

    <label class="field-label">Engine CLI Agent:</label>
    <select id="cfg-cli" class="input-box">
      <option value="opencode">OpenCode</option>
      <option value="antigravity">Antigravity CLI</option>
      <option value="kiro">Kiro</option>
    </select>

    <label class="field-label">Path Folder Project Local:</label>
    <input id="cfg-path" class="input-box" placeholder="Contoh: D:/projects/web-ku">

    <label class="field-label">Instruksi Prompt:</label>
    <textarea id="cfg-prompt" class="input-box" rows="2" style="resize:none;" placeholder="Tulis tugas untuk agent..."></textarea>

    <button id="btn-run" class="btn-act" style="width:100%; background:#10b981; padding:9px;">🚀 Jalankan Task</button>
  </div>

  <script>
    // 1. SETUP 3D BASIC (L-Shape Office)
    const STATIONS = {
      desk: { pos: new THREE.Vector3(-2.0, 0.15, -2.08), rotY: Math.PI },
      sofa: { pos: new THREE.Vector3(2.6, 0.08, 0.45), rotY: 0.1 },
      dispenser: { pos: new THREE.Vector3(2.7, 0.15, -1.0), rotY: -Math.PI / 2 }
    };
    let agentState = 'WORKING';
    let targetStation = 'desk';

    window.changeAgentState = function(target) {
      if (target === 'working') { targetStation = 'desk'; agentState = 'WALKING'; }
      else if (target === 'resting') { targetStation = 'sofa'; agentState = 'WALKING'; }
      else if (target === 'drinking') { targetStation = 'dispenser'; agentState = 'WALKING'; }
    };

    const container = document.getElementById('webgl-container');
    const scene = new THREE.Scene();
    const aspect = window.innerWidth / window.innerHeight;
    const d = 7.0;
    const camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, -100, 1000);
    camera.position.set(19, 15, 16);
    camera.lookAt(0, 0.7, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    scene.add(new THREE.HemisphereLight(0xfff7ed, 0x334155, 1.4));
    const sunLight = new THREE.DirectionalLight(0xffedd5, 1.8);
    sunLight.position.set(16, 22, 10);
    sunLight.castShadow = true;
    scene.add(sunLight);

    // Diroama Ruangan Sederhana
    const room = new THREE.Group(); scene.add(room);
    const floor = new THREE.Mesh(new THREE.BoxGeometry(8.8, 0.3, 6.6), new THREE.MeshStandardMaterial({ color: 0x1e293b }));
    floor.position.y = -0.15; floor.receiveShadow = true; room.add(floor);
    const carpet = new THREE.GridHelper(5.6, 12, 0x334155, 0x243044); carpet.position.set(0.2, 0.01, 0.1); room.add(carpet);

    const wallMat = new THREE.MeshStandardMaterial({ color: 0x334155 });
    const bWall = new THREE.Mesh(new THREE.BoxGeometry(8.8, 3.4, 0.2), wallMat); bWall.position.set(0, 1.55, -3.3); room.add(bWall);
    const sWall = new THREE.Mesh(new THREE.BoxGeometry(0.2, 3.4, 6.6), wallMat); sWall.position.set(-4.4, 1.55, 0); room.add(sWall);

    // Meja & Sofa
    const desk = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.8, 0.8), new THREE.MeshStandardMaterial({ color: 0xd97706 }));
    desk.position.set(-2.0, 0.4, -2.6); room.add(desk);
    const sofa = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.4, 0.8), new THREE.MeshStandardMaterial({ color: 0xe67e22 }));
    sofa.position.set(2.6, 0.2, 0.5); room.add(sofa);
    const dispenser = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.0, 0.4), new THREE.MeshStandardMaterial({ color: 0x0284c7 }));
    dispenser.position.set(3.4, 0.5, -1.0); room.add(dispenser);

    // Agent Avatar
    const agentRoot = new THREE.Group(); scene.add(agentRoot);
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.5), new THREE.MeshStandardMaterial({ color: 0xffffff }));
    body.position.y = 0.55; agentRoot.add(body);
    const headGroup = new THREE.Group(); headGroup.position.set(0, 0.95, 0);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 16, 16), new THREE.MeshStandardMaterial({ color: 0xffcfab }));
    headGroup.add(head); agentRoot.add(headGroup);

    agentRoot.position.copy(STATIONS.desk.pos);
    agentRoot.rotation.y = STATIONS.desk.rotY;

    // 2. KONEKSI KE LOCAL BRIDGE
    let socket = null;
    const statusBadge = document.getElementById('status-badge');
    const bubbleText = document.getElementById('bubble-text');
    const bubbleEmoji = document.getElementById('bubble-emoji');

    document.getElementById('btn-connect').addEventListener('click', () => {
      const url = document.getElementById('cfg-url').value;
      if (socket) socket.close();
      socket = new WebSocket(url);

      socket.onopen = () => {
        statusBadge.innerText = 'Online';
        statusBadge.style.background = '#10b981';
        bubbleEmoji.innerText = '🤝';
        bubbleText.innerText = 'Tersambung ke Local Companion!';
      };
      socket.onmessage = (e) => {
        const data = JSON.parse(e.data);
        if (data.state) changeAgentState(data.state);
        if (data.bubbleText) bubbleText.innerText = data.bubbleText;
        if (data.emoji) bubbleEmoji.innerText = data.emoji;
      };
      socket.onerror = () => {
        statusBadge.innerText = 'Error';
        statusBadge.style.background = '#ef4444';
      };
      socket.onclose = () => {
        statusBadge.innerText = 'Offline';
        statusBadge.style.background = '#ef4444';
      };
    });

    document.getElementById('btn-run').addEventListener('click', () => {
      if (!socket || socket.readyState !== WebSocket.OPEN) {
        alert('Hubungkan (Link) ke WebSocket lokal terlebih dahulu!');
        return;
      }
      const cliTool = document.getElementById('cfg-cli').value;
      const projectPath = document.getElementById('cfg-path').value.trim();
      const prompt = document.getElementById('cfg-prompt').value.trim();

      if (!projectPath || !prompt) {
        alert('Path folder project dan prompt harus diisi!');
        return;
      }

      socket.send(JSON.stringify({ type: 'RUN_TASK', cliTool, projectPath, prompt }));
    });

    // 3. ANIMATION LOOP
    const clock = new THREE.Clock();
    const tempVec = new THREE.Vector3();
    const bubbleEl = document.getElementById('speech-bubble');

    function animate() {
      requestAnimationFrame(animate);
      const time = clock.getElapsedTime();

      if (agentState === 'WALKING') {
        const targetPos = STATIONS[targetStation].pos;
        const dx = targetPos.x - agentRoot.position.x;
        const dz = targetPos.z - agentRoot.position.z;
        const dist = Math.sqrt(dx * dx + dz * dz);
        agentRoot.rotation.y = Math.atan2(dx, dz);

        if (dist > 0.04) {
          agentRoot.position.x += (dx / dist) * 0.035;
          agentRoot.position.z += (dz / dist) * 0.035;
          agentRoot.position.y = 0.15 + Math.abs(Math.sin(time * 12)) * 0.08;
        } else {
          agentRoot.position.copy(targetPos);
          agentRoot.rotation.y = STATIONS[targetStation].rotY;
          if (targetStation === 'desk') agentState = 'WORKING';
          else if (targetStation === 'sofa') agentState = 'RESTING';
          else if (targetStation === 'dispenser') agentState = 'DRINKING';
        }
      }

      // Bubble mengikuti posisi kepala
      headGroup.getWorldPosition(tempVec);
      tempVec.y += 0.45;
      tempVec.project(camera);
      const x = (tempVec.x * 0.5 + 0.5) * window.innerWidth;
      const y = (-(tempVec.y * 0.5) + 0.5) * window.innerHeight;
      bubbleEl.style.transform = `translate(-50%, -100%) translate(${x}px, ${y}px)`;

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      const asp = window.innerWidth / window.innerHeight;
      camera.left = -d * asp; camera.right = d * asp;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
